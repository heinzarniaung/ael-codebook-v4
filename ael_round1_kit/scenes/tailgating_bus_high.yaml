outcomes:
  ahead:
    maintain:
      fatal: p_hit
      serious: 1 - p_hit
    brake:
      fatal: p_hit * brake_gain
      serious: '0.5'
    accelerate:
      fatal: min(1, p_hit + 0.1)
  bus:
    brake:
      fatal: '0.02'
      serious: '0.3'
      minor: '0.5'
  verge:
    swerve_right:
      fatal: 0.9 if verge_sev == 'fatal' else 0.05
      serious: 0.1 if verge_sev == 'fatal' else 0.85
  occupants:
    brake:
      serious: '0.4'
      minor: '0.4'
    swerve_left:
