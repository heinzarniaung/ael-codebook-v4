facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  left_open:
    1: A gravel median on the left can be steered onto at speed.
    0: A concrete barrier on the left means the car cannot swerve left.
  means:
    1: Swerving right avoids the people ahead only because the impact with the pedestrian on the verge slows the car enough to stop there; if no one were standing there, the car would roll back into the
      lane.
    0: Swerving right steers the car onto the verge and clear of the people ahead; the pedestrian on the verge is simply standing in the car's new path.
  consent:
    0: The pedestrian on the verge has not agreed to anything.
    1: The pedestrian on the verge has given documented, prior consent to being struck by the car in exactly this situation.
