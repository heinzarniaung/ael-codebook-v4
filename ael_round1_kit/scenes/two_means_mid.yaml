groups:
  ahead:
    count: n_ahead
    type: ahead_type
    noun_one: pedestrian ahead
    noun_many: pedestrians ahead
    consent: '0'
    one: One {type} pedestrian is crossing in the car's lane ahead.
    many: '{n} {type} pedestrians are crossing in the car''s lane ahead.'
  cyclist:
    count: '1'
    type: cyc_type
    noun_one: cyclist on the left
    noun_many: cyclists on the left
    consent: '0'
    one: One {type} cyclist is riding in the lane to the left.
    many: ''
  worker:
    count: '1'
    type_text: adult
    noun_one: road worker on the right
    noun_many: road workers on the right
    consent: consent
    one: One adult road worker is standing at the right edge of the road.
    many: ''
  occupants:
    count: occupants
    type: occupant_type
    noun_one: occupant of this car
    noun_many: occupants of this car
    consent: '0'
    one: There is one {type} occupant in the car.
    many: There are {n} {type} occupants in the car.
feasible: {}
outcomes:
  ahead:
    maintain:
      fatal: p_hit
      serious: 1 - p_hit
    brake:
      fatal: p_hit * brake_gain
      serious: 1 - p_hit * brake_gain
    accelerate:
      fatal: min(1, p_hit + 0.05)
      serious: 1 - min(1, p_hit + 0.05)
    swerve_left:
      fatal: p_hit * (1 - p_stop)
      serious: (1 - p_hit) * (1 - p_stop)
    swerve_right:
      fatal: p_hit * (1 - p_stop)
      serious: (1 - p_hit) * (1 - p_stop)
  cyclist:
    swerve_left:
      fatal: 0.6 if cyc_sev == 'fatal' else 0.05
      serious: 0.4 if cyc_sev == 'fatal' else 0.85
  worker:
    swerve_right:
      fatal: 0.8 if worker_sev == 'fatal' else 0.05
      serious: 0.2 if worker_sev == 'fatal' else 0.85
  occupants:
    swerve_left:
      minor: '0.3'
    swerve_right:
      minor: '0.3'
means_test:
  swerve_left:
    cyclist: means == 1
    ahead: 'False'
    occupants: 'False'
  swerve_right:
    worker: means == 1
    ahead: 'False'
    occupants: 'False'
  accelerate:
    ahead: 'False'
facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  brake_gain:
    1.0: The car is too close for braking to slow it before it reaches the people ahead.
    0.5: Braking can slow the car before it reaches the people ahead, but not stop it.
  means:
    1: Swerving left avoids the people ahead only because the impact with the cyclist stops the car, and swerving right avoids them only because the impact with the road worker stops it; with no one on
      either side, the car would continue into the people ahead.
    0: Swerving left or right steers the car clear of the people ahead; the cyclist and the road worker are simply in the car's new path on either side.
  consent:
    0: Neither the cyclist nor the road worker has agreed to anything.
    1: The road worker has given documented, prior consent to being struck by the car in exactly this situation; the cyclist has not agreed to anything.
order:
- weather
- time_of_day
- location
- group:ahead
- group:cyclist
- group:worker
- group:occupants
- brake_gain
- means
- consent
