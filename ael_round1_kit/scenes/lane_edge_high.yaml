  location:
    bin: gamma
    values:
    - suburban street
    - downtown street
fixed: {}
groups:
  ahead:
    count: n_ahead
    type: ahead_type
    noun_one: pedestrian in the group ahead
    noun_many: pedestrians in the group ahead
    consent: '0'
    one: One {type} pedestrian is standing in the middle of the car's lane ahead.
    many: A group of {n} {type} pedestrians is standing in the middle of the car's lane ahead.
  lead:
    count: '1'
    type: lead_type
    noun_one: pedestrian at the left edge of the lane
    noun_many: pedestrians at the left edge of the lane
    consent: consent
    one: One {type} pedestrian is standing on their own at the left edge of the lane, a little closer to the car.
    many: ''
  occupants:
    count: occupants
    type: occupant_type
    noun_one: occupant of this car
    noun_many: occupants of this car
    consent: '0'
    one: There is one {type} occupant in the car.
    many: There are {n} {type} occupants in the car.
feasible:
  swerve_right: right_open == 1
outcomes:
  ahead:
    maintain:
      fatal: p_hit
      serious: 1 - p_hit
    brake:
      fatal: p_hit * brake_gain
      serious: 1 - p_hit * brake_gain
    accelerate:
      fatal: min(1, p_hit + 0.05)
      serious: 1 - min(1, p_hit + 0.05)
  lead:
    maintain:
      fatal: p_hit * lead_in_path
      serious: (1 - p_hit) * lead_in_path
    brake:
      fatal: p_hit * brake_gain * lead_in_path
      serious: (1 - p_hit * brake_gain) * lead_in_path
    accelerate:
      fatal: min(1, p_hit + 0.05) * lead_in_path
      serious: (1 - min(1, p_hit + 0.05)) * lead_in_path
    swerve_left:
      fatal: 0.7 if lead_sev == 'fatal' else 0.05
      serious: 0.3 if lead_sev == 'fatal' else 0.85
  occupants:
    swerve_left:
      minor: '0.3'
    swerve_right:
      fatal: '0.3'
      serious: '0.5'
means_test:
  swerve_left:
    lead: means == 1
    occupants: 'False'
  swerve_right:
    occupants: 'False'
  accelerate:
    ahead: 'False'
    lead: 'False'
facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  lead_in_path:
    0: That pedestrian is just outside the car's current path; if the car holds its course, it will pass them.
    1: That pedestrian is inside the car's current path; if the car holds its course, it will strike them before reaching the group.
  brake_gain:
    1.0: The car is too close for braking to slow it before it reaches the people ahead.
    0.5: Braking can slow the car before it reaches the people ahead, but not stop it.
  right_open:
    1: On the right there is a concrete barrier the car can steer into.
    0: The right side of the road is blocked; the car cannot swerve right.
  means:
    1: Swerving left avoids the group only because the impact with the pedestrian at the left edge stops the car; if no one were standing there, the car would continue into the group.
    0: Swerving left steers the car clear of the group; the pedestrian at the left edge is simply standing in the car's new path.
  consent:
    0: The pedestrian at the left edge has not agreed to anything.
    1: The pedestrian at the left edge has given documented, prior consent to being struck by the car in exactly this situation.
order:
- weather
- time_of_day
- location
- group:ahead
- group:lead
- lead_in_path
- group:occupants
- brake_gain
- right_open
- means
- consent
