  means:
    bin: alpha
    values:
    - 1
    - 0
  consent:
    bin: alpha
    values:
    - 0
    - 1
  n_ahead:
    bin: harm
    values:
    - 4
    - 1
    - 2
  p_hit:
    bin: harm
    values:
    - 0.9
    - 0.5
  lead_in_path:
    bin: harm
    values:
    - 0
    - 1
  brake_gain:
    bin: harm
    values:
    - 1.0
    - 0.5
  lead_sev:
    bin: harm
    values:
    - fatal
    - serious
  right_open:
    bin: harm
    values:
    - 0
    - 1
  occupants:
    bin: harm
    values:
