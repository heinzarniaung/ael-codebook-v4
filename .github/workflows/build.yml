name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ael_round1_kit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3 jsonschema==4.26.0
      - name: No generated files committed
        run: |
          tracked=$(git ls-files scenes expected catalog.md ../round1_scenarios.json)
          if [ -n "$tracked" ]; then echo "Generated files are tracked; remove them with git rm --cached:"; echo "$tracked"; exit 1; fi
      - run: python make_scenes.py
      - run: python lint.py scenes/*.yaml
      - run: python reference_pipeline.py scenes/*.yaml --out expected
      - run: python reviews.py summary
      - run: python verify_round.py expected
